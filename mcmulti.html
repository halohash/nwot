			window["writeText"] = function(text, posList, colorList) {
    if (typeof text !== 'string') {
        console.error("writeText expects a string, but got: ", text);
        return;
    }
    let OGXpos = posList[0];
    for (let char of text) {
        writeCharToXY(char, colorList, posList[0], posList[1]);
        if (char === "\n") {
            posList[1] += 1;
            posList[0] = OGXpos;
        } else {
            posList[0] += 1;
        }
    }
}
			/*
	Export part of a world as HTML
	12/21/2022
	Instructions:
	Press Alt+D or Ctrl+X and select part of a world. A file will be saved once you let go of your mouse.
*/

var reg = new RegionSelection();
reg.init();

reg.onselection(function(start, end, width, height) {
	var tx = start[0];
	var ty = start[1];
	var cx = start[2];
	var cy = start[3];
	var name = state.worldModel.name;
	var res = "";
	res += "<html>";
	res += "<head>";
	res += "<title>World - \"" + encodeURIComponent(name) + "\"</title>";
	res += "<style>";
	res += "";
	res += "</style>";
	res += "</head>";
	res += "<body>";
	res += "<pre style=\"font-family: 'Courier New'; font-size: 16px;\">";
	var prevColor = 0;
	for(var y = 0; y < height; y++) {
		var line = "";
		for(var x = 0; x < width; x++) {
			var ci = getCharInfo(tx, ty, cx, cy);
			
			var char = html_tag_esc(ci.char);
			char = char.replace(/\t/g, " ");
			char = char.replace(/\r/g, " ");
			char = char.replace(/\n/g, " ");
			var color = ci.color;
			
			if(prevColor == color) {
				res += char;
			} else {
				if(prevColor > 0) {
					res += "</span>";
				}
				if(color > 0) {
					res += "<span style=\"color:#" + (color.toString(16).padStart(6, 0)) + "\">";
				}
				res += char;
			}
			
			prevColor = color;
			
			cx++;
			if(cx >= 16) {
				cx = 0;
				tx++;
			}
		}
		cy++;
		if(cy >= 8) {
			ty++;
			cy = 0;
		}
		cx = start[2];
		tx = start[0];
		if(prevColor > 0) {
			res += "</span>";
		}
		prevColor = 0;
		res += "<br>";
	}
	res += "</pre>";
	res += "</body>";
	res += "</html>";
	
	var save = document.createElement("a");
	var blob = new Blob([res], {type: "text/html"});
	var url = window.URL.createObjectURL(blob);
	save.href = url;
	save.download = "export-" + Date.now() + ".html";
	save.click();
	window.URL.revokeObjectURL(blob);
});

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        // Background tabs clamp main-thread setTimeout to ~1/sec, which would crawl the
        // draw. A Web Worker's timers are not throttled that way, so we use the worker as
        // a clock and resolve on its messages. Falls back to setTimeout if a worker can't
        // be created (e.g. CSP blocks blob workers).
        let g_timerWorker = null;
        let g_timerSeq = 0;
        const g_timerCb = new Map();
        function initTimerWorker() {
            try {
                const src = 'self.onmessage=function(e){var d=e.data;setTimeout(function(){self.postMessage(d.id);},d.ms);};';
                const url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
                const wk = new Worker(url);
                wk.onmessage = function (e) {
                    const cb = g_timerCb.get(e.data);
                    if (cb) { g_timerCb.delete(e.data); cb(); }
                };
                g_timerWorker = wk;
                return true;
            } catch (e) { g_timerWorker = null; return false; }
        }
        function bgSleep(ms) {
            return new Promise((res) => {
                if (g_timerWorker) {
                    const id = ++g_timerSeq;
                    g_timerCb.set(id, res);
                    try { g_timerWorker.postMessage({ id, ms }); }
                    catch (e) { g_timerCb.delete(id); setTimeout(res, ms); }
                } else {
                    setTimeout(res, ms);
                }
            });
        }

        function log(text) {
            const box = document.getElementById('owotid-log');
            const line = '[' + new Date().toLocaleTimeString() + '] ' + text;
            if (!box) { console.log('[owot-id] ' + text); return; }
            const div = document.createElement('div');
            div.textContent = line;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
            while (box.childNodes.length > 300) box.removeChild(box.firstChild);
        }

        function readInt(id) {
            const el = document.getElementById(id);
            if (!el) return NaN;
            const v = parseInt((el.value || '').trim(), 10);
            return Number.isFinite(v) ? v : NaN;
        }

        function isChecked(id) { const el = document.getElementById(id); return el ? !!el.checked : false; }
        function readSelect(id) { const el = document.getElementById(id); return el ? el.value : ''; }

        // ---- emoji palette (coverage-adjusted perceived colors) ------------------
        //
        // CHANGE v3.3: Previously, the palette measured each emoji's average color
        // only over its opaque pixels, then filtered out low-coverage glyphs at 0.42.
        // The problem: a 50%-filled emoji placed on a white background looks like a
        // 50/50 blend of its color and white when zoomed out. The old code picked
        // whichever emoji's raw opaque color was closest, which could be badly wrong
        // for sparse glyphs that leave lots of whitespace.
        //
        // Fix: blend each emoji's measured color with the world background color,
        // weighted by coverage. This gives the *perceived* color at zoom-out, which is
        // what the nearest-neighbor search should actually be matching against.
        //   perceived = emojiColor * coverage + bgColor * (1 - coverage)
        //
        // The coverage threshold is also lowered from 0.42 → 0.15 so that partially-
        // filled but useful emojis are no longer excluded from the palette.
        //
        // nearestEmoji() also gains a small coverage penalty (see below) so that when
        // two emojis are similarly close in perceived color, the denser one wins.

        function getEmojiPalette() {
            if (g_emojiPalette) return g_emojiPalette;
            const S = 28;
            const cv = document.createElement('canvas');
            cv.width = S; cv.height = S;
            const ctx = cv.getContext('2d', { willReadFrequently: true });
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = Math.round(S * 0.82) + 'px "Segoe UI Emoji","Noto Color Emoji","Apple Color Emoji","Twemoji Mozilla",sans-serif';

            // Use the actual world background for blending so the palette adapts to
            // dark/light themes automatically.
            const bg = getWorldBg(); // [r, g, b]

            const pal = [];
            for (const ch of EMOJI_CHARS) {
                ctx.clearRect(0, 0, S, S);
                try { ctx.fillText(ch, S / 2, S / 2 + 1); } catch (e) { continue; }
                let d;
                try { d = ctx.getImageData(0, 0, S, S).data; } catch (e) { continue; }

                let r = 0, g = 0, b = 0, n = 0;
                const totalPixels = S * S;

                for (let i = 0; i < d.length; i += 4) {
                    if (d[i + 3] < 13) continue; // skip near-transparent pixels
                    r += d[i]; g += d[i + 1]; b += d[i + 2]; n++;
                }

                const coverage = n / totalPixels;

                // Drop truly missing glyphs (tofu boxes, zero-coverage) but keep
                // legitimately sparse emojis that are still usable.
                if (coverage < 0.15) continue;

                // Raw average color of the emoji's own pixels
                const emojiR = n > 0 ? r / n : 255;
                const emojiG = n > 0 ? g / n : 255;
                const emojiB = n > 0 ? b / n : 255;

                // Perceived color = what the eye actually sees at zoom-out.
                // Sparse emojis blend toward the background; solid ones stay true.
                const perceivedR = Math.round(emojiR * coverage + bg[0] * (1 - coverage));
                const perceivedG = Math.round(emojiG * coverage + bg[1] * (1 - coverage));
                const perceivedB = Math.round(emojiB * coverage + bg[2] * (1 - coverage));

                pal.push({
                    ch,
                    rgb: [perceivedR, perceivedG, perceivedB], // used for color matching
                    rawRgb: [Math.round(emojiR), Math.round(emojiG), Math.round(emojiB)],
                    coverage
                });
            }

            if (!pal.length) {
                // hard fallback so emoji mode still works if measuring failed
                pal.push(
                    { ch: '🟥', rgb: [221, 46, 68],   rawRgb: [221, 46, 68],   coverage: 1 },
                    { ch: '🟩', rgb: [120, 177, 89],  rawRgb: [120, 177, 89],  coverage: 1 },
                    { ch: '🟦', rgb: [85, 172, 238],  rawRgb: [85, 172, 238],  coverage: 1 },
                    { ch: '🟨', rgb: [253, 203, 88],  rawRgb: [253, 203, 88],  coverage: 1 },
                    { ch: '⬛', rgb: [40, 44, 52],    rawRgb: [40, 44, 52],    coverage: 1 },
                    { ch: '⬜', rgb: [233, 234, 236], rawRgb: [233, 234, 236], coverage: 1 }
                );
            }

            g_emojiPalette = pal;
            log('Emoji palette ready: ' + pal.length + ' colors (coverage-adjusted perceived color, bg=[' + bg + ']).');
            return pal;
        }

        // CHANGE v3.3: Added a small coverage penalty so that when two emojis have
        // similar perceived colors, the denser/more-solid one is preferred. The penalty
        // of 1500 means a sparse emoji needs to be ~39 RGB units closer in perceived
        // color to beat a fully-covered one. Adjust to taste (0 = disable penalty).
        function nearestEmoji(pal, r, g, b) {
            let best = 0, bestD = Infinity;
            for (let k = 0; k < pal.length; k++) {
                const p = pal[k].rgb;
                const dr = r - p[0], dg = g - p[1], db = b - p[2];
                // Penalty biases toward denser emojis when perceived color is close
                const coveragePenalty = (1 - (pal[k].coverage || 1)) * 1500;
                const d = dr * dr + dg * dg + db * db + coveragePenalty;
                if (d < bestD) { bestD = d; best = k; }
            }
            return best;
        }

        // ---- world / permission / rate detection ---------------------------------

        function canColorText() {
            try {
                if (W.Permissions && W.state)
                    return !!W.Permissions.can_color_text(W.state.userModel, W.state.worldModel);
            } catch (e) {}
            return true;
        }

        function getRateInfo() {
            try {
                const wm = W.state.worldModel;
                const um = W.state.userModel;
                const cr = Array.isArray(wm.char_rate) ? wm.char_rate : [0, 1000];
                const member = !!(um.is_member || um.is_owner);
                const count = cr[0] | 0;
                const ms = (cr[1] | 0) || 1000;
                const writeInterval = (wm.write_interval | 0) || 1000;
                let cps;
                if (member) cps = 280;
                else if (count <= 0) cps = 0;
                else {
                    const base = Math.min(ms, 60 * 1000);
                    cps = Math.floor(1000 / base * count) - 1;
                    if (cps < 1) cps = 1;
                    if (cps > 280) cps = 280;
                }
                return { count, ms, writeInterval, member, cps };
            } catch (e) {
                return { count: 0, ms: 1000, writeInterval: 1000, member: false, cps: 60 };
            }
        }

        function computeAutoThroughput() {
            const r = getRateInfo();
            const cps = r.member ? 280 : r.cps;
            if (cps <= 0) return { chunk: 1, sleep: 1000, cps: 0, info: r };
            const target = Math.max(1, cps * 0.8);
            let chunk = Math.max(1, Math.min(512, Math.round(target * 0.5)));
            let sleep = Math.max(0, Math.round(chunk / target * 1000));
            if (sleep < r.writeInterval / 2) sleep = Math.round(r.writeInterval / 2);
            return { chunk, sleep, cps, info: r };
        }

        function updateWorldInfo() {
            const box = document.getElementById('owotid-worldinfo');
            if (!box) return;
            const r = getRateInfo();
            const color = canColorText();
            const auto = computeAutoThroughput();
            let html = '';
            html += 'Colored text: <b style="color:' + (color ? '#7d7' : '#f77') + '">'
                + (color ? 'allowed' : 'DISABLED') + '</b><br>';
            if (r.member) html += 'Rate: member/owner (~280 cells/s)<br>';
            else if (r.cps <= 0) html += 'Rate: <b style="color:#f77">guests cannot write here</b><br>';
            else html += 'Rate: ' + r.count + ' chars / ' + r.ms + 'ms &rarr; ~' + r.cps + ' cells/s<br>';
            html += 'Auto throughput: chunk ' + auto.chunk + ', sleep ' + auto.sleep + 'ms';
            if (!color) html += '<br><span style="color:#fb6">Tip: Emoji mode keeps colors here.</span>';
            box.innerHTML = html;
            if (isChecked('owotid-autorate') && auto.chunk > 0) {
                document.getElementById('owotid-chunk').value = String(auto.chunk);
                document.getElementById('owotid-sleep').value = String(auto.sleep);
            }
        }

        function effectiveDrawMode() {
            const m = readSelect('owotid-drawmode');
            if (m === 'block') return 'block';
            if (m === 'emoji') return 'emoji';
            return canColorText() ? 'block' : 'emoji';   // auto
        }

        // ---- local (optimistic) write + send -------------------------------------

        function applyLocalWrite(tileX, tileY, charX, charY, ch, fgColor, bgColor) {
            try {
                if (!W.w || !W.w.tile || typeof W.w.tile.get !== 'function') return false;
                let tile = W.w.tile.get(tileX, tileY);
                if (!tile) return false;
                if (typeof tile.content === 'string') {
                    if (W.w.splitTile) tile.content = W.w.splitTile(tile.content);
                    else return false;
                }
                if (!tile.properties) tile.properties = {};
                if (!Array.isArray(tile.properties.color)) tile.properties.color = new Array(TILE_AREA).fill(0);
                if (bgColor !== -1 && !Array.isArray(tile.properties.bgcolor)) tile.properties.bgcolor = new Array(TILE_AREA).fill(-1);
                const idx = charY * TILE_C + charX;
                tile.content[idx] = ch;
                tile.properties.color[idx] = fgColor;
                if (tile.properties.bgcolor) tile.properties.bgcolor[idx] = bgColor;
                if (typeof W.w.setTileRedraw === 'function') W.w.setTileRedraw(tileX, tileY, true);
                return true;
            } catch (e) { return false; }
        }

        function writeWithResponse(edits) {
            return new Promise((resolve) => {
                let done = false;
                const finish = (v) => { if (!done) { done = true; resolve(v); } };
                try {
                    if (W.w && W.w.net && typeof W.w.net.write === 'function') {
                        W.w.net.write(edits, {}, (data) => finish(data || null));
                        setTimeout(() => finish(null), 8000);
                        return;
                    }
                } catch (e) { log('w.net.write threw: ' + e.message); }
                try {
                    if (W.w && W.w.socket && W.w.socket.socket && typeof W.w.socket.socket.send === 'function') {
                        W.w.socket.socket.send(JSON.stringify({ kind: 'write', edits: edits }));
                        finish(null);
                        return;
                    }
                } catch (e) { log('socket send threw: ' + e.message); }
                finish(false);
            });
        }

        function nextObjId() {
            if (typeof W.nextObjId === 'number') return W.nextObjId++;
            return g_nextObjId++;
        }

        function hookCursorEvents() {
            if (g_cursorHooked) return true;
            if (!W.w || typeof W.w.on !== 'function') return false;
            const setCur = (data) => {
                if (data && Number.isFinite(data.tileX) && Number.isFinite(data.tileY)
                        && Number.isFinite(data.charX) && Number.isFinite(data.charY)) {
                    g_cursor = { tileX: data.tileX | 0, tileY: data.tileY | 0, charX: data.charX | 0, charY: data.charY | 0 };
                }
            };
            try { W.w.on('cursorShow', setCur); } catch (e) {}
            try { W.w.on('cursorMove', setCur); } catch (e) {}
            try { W.w.on('cursorHide', () => { g_cursor = null; }); } catch (e) {}
            try { W.w.on('mouseDown', (d) => { setCur(d); }); } catch (e) {}
            g_cursorHooked = true;
            return true;
        }

        function getViewCenterCell() {
            try {
                if (W.w && typeof W.w.getCenterCoords === 'function') {
                    const c = W.w.getCenterCoords(); // [y, x] fractional tiles
                    if (Array.isArray(c) && c.length >= 2) {
                        const fy = c[0], fx = c[1];
                        const tileY = Math.floor(fy), tileX = Math.floor(fx);
                        let charX = Math.round((fx - tileX) * TILE_C);
                        let charY = Math.round((fy - tileY) * TILE_R);
                        let tx = tileX, ty = tileY;
                        if (charX >= TILE_C) { charX = 0; tx += 1; }
                        if (charY >= TILE_R) { charY = 0; ty += 1; }
                        return { tileX: tx, tileY: ty, charX, charY };
                    }
                }
            } catch (e) {}
            return null;
        }

        function gotoCoord() {
            const x = readInt('owotid-gox');
            const y = readInt('owotid-goy');
            if (!Number.isFinite(x) || !Number.isFinite(y)) { log('Enter X and Y to go to.'); return; }
            try {
                if (W.w && typeof W.w.doGoToCoord === 'function') {
                    W.w.doGoToCoord(y, x, false); // (y, x, relative) — same coords as the on-screen X:/Y:
                    log('Went to coordinate X=' + x + ', Y=' + y + '. Use "From view center" to set the draw position there.');
                    return;
                }
            } catch (e) { log('doGoToCoord threw: ' + e.message); }
            log('Go-to-coordinate API unavailable on this build.');
        }

        function cssColorToRgb(str, fallback) {
            try {
                const cv = document.createElement('canvas');
                cv.width = cv.height = 1;
                const cx = cv.getContext('2d');
                cx.fillStyle = '#000';
                cx.fillStyle = str;
                cx.fillRect(0, 0, 1, 1);
                const d = cx.getImageData(0, 0, 1, 1).data;
                return [d[0], d[1], d[2]];
            } catch (e) { return fallback || [0, 0, 0]; }
        }
        function getDefaultTextColor() {
            try { if (W.styles && W.styles.text) return cssColorToRgb(W.styles.text, [0, 0, 0]); } catch (e) {}
            return [0, 0, 0];
        }
        function getWorldBg() {
            try { if (W.styles && W.styles.background) return cssColorToRgb(W.styles.background, [255, 255, 255]); } catch (e) {}
            return [255, 255, 255];
        }

        function getSourceForSampling() {
            if (!g_image) return null;

            const maxPx = Math.max(16, readInt('owotid-presize-max') || 1024);

                g_imagePresized = null; g_imagePresizedKey = '';
                return { src: g_image, w: g_image.width, h: g_image.height };
            }
            const key = maxPx + 'x' + g_image.width + 'x' + g_image.height;
            if (g_imagePresized && g_imagePresizedKey === key)
                return { src: g_imagePresized, w: g_imagePresized.width, h: g_imagePresized.height };
            const scale = Math.min(maxPx / g_image.width, maxPx / g_image.height);
            const tw = Math.max(1, Math.round(g_image.width * scale));
            const th = Math.max(1, Math.round(g_image.height * scale));
            const canvas = document.createElement('canvas');
            canvas.width = tw; canvas.height = th;
            const ctx = canvas.getContext('2d');

            g_imagePresized = canvas; g_imagePresizedKey = key;

        function getSampleDims() {

        // 4x4 Bayer ordered matrix for even "skip pixels" distribution
        const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
        function sparseSkip(x, y, frac) {
            if (frac <= 0) return false;
            const t = (BAYER4[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
            return t >= (1 - frac);
        }

        function buildProcessedImageData() {
            const dim = getSampleDims();
            const canvas = document.createElement('canvas');
            canvas.width = dim.w; canvas.height = dim.h;
            const ctx = canvas.getContext('2d');
            const smooth = document.getElementById('owotid-smooth').checked;
            ctx.imageSmoothingEnabled = smooth;
            if (smooth) ctx.imageSmoothingQuality = 'high';
            const bright = readInt('owotid-bright') || 100;
            const contrast = readInt('owotid-contrast') || 100;
            const sat = readInt('owotid-sat') || 100;
            ctx.filter = 'brightness(' + (bright / 100) + ') contrast(' + (contrast / 100) + ') saturate(' + (sat / 100) + ')';
            const sample = getSourceForSampling();
            if (sample) ctx.drawImage(sample.src, 0, 0, dim.w, dim.h);
            ctx.filter = 'none';
            const data = ctx.getImageData(0, 0, dim.w, dim.h);
            const buf = data.data;
            const gamma = (readInt('owotid-gamma') || 100) / 100;
            if (gamma !== 1.0 && gamma > 0) applyGamma(buf, gamma);
            const bw = isChecked('owotid-bw');
            if (isChecked('owotid-grayscale') || bw) {
                for (let i = 0; i < buf.length; i += 4) {
                    const l = Math.round(0.299 * buf[i] + 0.587 * buf[i + 1] + 0.114 * buf[i + 2]);
                    buf[i] = buf[i + 1] = buf[i + 2] = l;
                }
            }
            if (effectiveDrawMode() === 'block') {
                if (bw) {
                    if (isChecked('owotid-dither')) ditherBW(buf, dim.w, dim.h);
                    else thresholdBW(buf);
                } else {
                    const paletteN = Math.max(0, readInt('owotid-palette') || 0);
                    if (paletteN >= 2) quantizeMedianCut(buf, dim.w, dim.h, paletteN);
                    if (isChecked('owotid-dither')) ditherFS(buf, dim.w, dim.h);
                }
            }
            return { data, w: dim.w, h: dim.h };
        }

        function applyGamma(buf, gamma) {
            const lut = new Uint8Array(256);
            const invG = 1 / gamma;
            for (let i = 0; i < 256; i++) lut[i] = Math.min(255, Math.max(0, Math.round(Math.pow(i / 255, invG) * 255)));
            for (let i = 0; i < buf.length; i += 4) { buf[i] = lut[buf[i]]; buf[i + 1] = lut[buf[i + 1]]; buf[i + 2] = lut[buf[i + 2]]; }
        }

        function ditherFS(buf, w, h) {
            const fbuf = new Float32Array(buf.length);
            for (let i = 0; i < buf.length; i++) fbuf[i] = buf[i];
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    for (let c = 0; c < 3; c++) {
                        const o = fbuf[i + c];
                        const n = Math.max(0, Math.min(255, Math.round(o / 32) * 32));
                        const err = o - n;
                        fbuf[i + c] = n;
                        if (x + 1 < w) fbuf[i + 4 + c] += err * 7 / 16;
                        if (y + 1 < h) {
                            if (x > 0) fbuf[i + (w * 4) - 4 + c] += err * 3 / 16;
                            fbuf[i + (w * 4) + c] += err * 5 / 16;
                            if (x + 1 < w) fbuf[i + (w * 4) + 4 + c] += err * 1 / 16;
                        }
                    }
                }
            }
            for (let i = 0; i < buf.length; i++) buf[i] = Math.max(0, Math.min(255, fbuf[i] | 0));
        }

        function ditherBW(buf, w, h) {
            const f = new Float32Array(w * h);
            for (let p = 0, i = 0; p < w * h; p++, i += 4) f[p] = buf[i];
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const p = y * w + x;
                    const o = f[p];
                    const n = o < 128 ? 0 : 255;
                    const err = o - n;
                    f[p] = n;
                    if (x + 1 < w) f[p + 1] += err * 7 / 16;
                    if (y + 1 < h) {
                        if (x > 0) f[(y + 1) * w + x - 1] += err * 3 / 16;
                        f[(y + 1) * w + x] += err * 5 / 16;
                        if (x + 1 < w) f[(y + 1) * w + x + 1] += err * 1 / 16;
                    }
                }
            }
            for (let p = 0, i = 0; p < w * h; p++, i += 4) {
                const v = f[p] < 128 ? 0 : 255;
                buf[i] = buf[i + 1] = buf[i + 2] = v;
            }
        }

        function thresholdBW(buf) {
            for (let i = 0; i < buf.length; i += 4) {
                const v = buf[i] < 128 ? 0 : 255;
                buf[i] = buf[i + 1] = buf[i + 2] = v;
            }
        }

        function quantizeMedianCut(buf, w, h, maxColors) {
            const pixels = [];
            for (let i = 0; i < buf.length; i += 4) {
                if (buf[i + 3] < 64) continue;
                pixels.push([buf[i], buf[i + 1], buf[i + 2], i]);
            }
            if (pixels.length === 0) return;
            const buckets = [pixels];
            while (buckets.length < maxColors) {
                let chosen = -1, biggestRange = -1;
                for (let b = 0; b < buckets.length; b++) {
                    if (buckets[b].length < 2) continue;
                    let rMin = 256, rMax = -1, gMin = 256, gMax = -1, bMin = 256, bMax = -1;
                    for (const p of buckets[b]) {
                        if (p[0] < rMin) rMin = p[0]; if (p[0] > rMax) rMax = p[0];
                        if (p[1] < gMin) gMin = p[1]; if (p[1] > gMax) gMax = p[1];
                        if (p[2] < bMin) bMin = p[2]; if (p[2] > bMax) bMax = p[2];
                    }
                    const range = Math.max(rMax - rMin, gMax - gMin, bMax - bMin);
                    if (range > biggestRange) { biggestRange = range; chosen = b; }
                }
                if (chosen < 0) break;
                const bucket = buckets[chosen];
                let rMin = 256, rMax = -1, gMin = 256, gMax = -1, bMin = 256, bMax = -1;
                for (const p of bucket) {
                    if (p[0] < rMin) rMin = p[0]; if (p[0] > rMax) rMax = p[0];
                    if (p[1] < gMin) gMin = p[1]; if (p[1] > gMax) gMax = p[1];
                    if (p[2] < bMin) bMin = p[2]; if (p[2] > bMax) bMax = p[2];
                }
                const rangeR = rMax - rMin, rangeG = gMax - gMin, rangeB = bMax - bMin;
                let sortIdx = 0;
                if (rangeG >= rangeR && rangeG >= rangeB) sortIdx = 1;
                else if (rangeB >= rangeR) sortIdx = 2;
                bucket.sort((a, b) => a[sortIdx] - b[sortIdx]);
                const mid = bucket.length >> 1;
                buckets.splice(chosen, 1, bucket.slice(0, mid), bucket.slice(mid));
            }
            const palette = buckets.map(bucket => {
                let r = 0, g = 0, b = 0;
                for (const p of bucket) { r += p[0]; g += p[1]; b += p[2]; }
                const n = bucket.length || 1;
                return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
            });
            for (let i = 0; i < buf.length; i += 4) {
                if (buf[i + 3] < 64) continue;
                let best = 0, bestD = Infinity;
                for (let k = 0; k < palette.length; k++) {
                    const dr = buf[i] - palette[k][0], dg = buf[i + 1] - palette[k][1], db = buf[i + 2] - palette[k][2];
                    const d = dr * dr + dg * dg + db * db;
                    if (d < bestD) { bestD = d; best = k; }
                }
                buf[i] = palette[best][0]; buf[i + 1] = palette[best][1]; buf[i + 2] = palette[best][2];
            }
        }

        // Map pixels to nearest emoji color, optional FS dither against the emoji palette.
        // CHANGE v3.3: nearestEmoji now uses coverage-adjusted perceived colors + coverage
        // penalty, so dithering error propagation is also against the perceived color.
        function mapToEmoji(buf, w, h, dither, skipWhite, sparse) {
            const pal = getEmojiPalette();
            const idx = new Int16Array(w * h).fill(-1);
            const fb = dither ? Float32Array.from(buf) : null;
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    if (buf[i + 3] < 16) continue;
                    if (sparse > 0 && sparseSkip(x, y, sparse)) continue;
                    let r, g, b;
                    if (dither) { r = Math.max(0, Math.min(255, fb[i])); g = Math.max(0, Math.min(255, fb[i + 1])); b = Math.max(0, Math.min(255, fb[i + 2])); }
                    else { r = buf[i]; g = buf[i + 1]; b = buf[i + 2]; }
                    if (skipWhite && r >= 248 && g >= 248 && b >= 248) continue;
                    const k = nearestEmoji(pal, r, g, b);
                    idx[y * w + x] = k;
                    if (dither) {
                        // Propagate error against the perceived color (coverage-blended),
                        // not the raw emoji color, so dithering compensates correctly.
                        const p = pal[k].rgb;
                        const er = r - p[0], eg = g - p[1], eb = b - p[2];
                        const push = (xx, yy, f) => {
                            if (xx < 0 || xx >= w || yy < 0 || yy >= h) return;
                            const j = (yy * w + xx) * 4;
                            fb[j] += er * f; fb[j + 1] += eg * f; fb[j + 2] += eb * f;
                        };
                        push(x + 1, y, 7 / 16); push(x - 1, y + 1, 3 / 16); push(x, y + 1, 5 / 16); push(x + 1, y + 1, 1 / 16);
                    }
                }
            }
            return { idx, pal };
        }

        function sparseFrac() { return Math.max(0, Math.min(95, readInt('owotid-sparse') || 0)) / 100; }

        // ---- preview -------------------------------------------------------------

        function renderPreview() {
            const c = document.getElementById('owotid-preview');
            if (!c) return;
            const dim = getSampleDims();
            const mode = effectiveDrawMode();
            const doubleW = isDoubleWidth() && mode === 'block';
            const renderedWCells = doubleW ? dim.w * 2 : dim.w;
            const owotPxW = renderedWCells * OWOT_CELL_W;
            const owotPxH = dim.h * OWOT_CELL_H;
            const displayW = Math.min(340, dim.w * 4);
            const displayH = Math.max(1, Math.round(displayW * (owotPxH / owotPxW)));
            const bg = getWorldBg();
            const bgCss = 'rgb(' + bg[0] + ',' + bg[1] + ',' + bg[2] + ')';

            if (!g_image) {
                c.width = dim.w; c.height = dim.h;
                c.style.width = displayW + 'px'; c.style.height = displayH + 'px';
                const ctx = c.getContext('2d');
                ctx.fillStyle = bgCss; ctx.fillRect(0, 0, dim.w, dim.h);
                return;
            }

            const proc = buildProcessedImageData();
            const data = proc.data.data;
            const w = proc.w, h = proc.h;
            const skipWhite = isChecked('owotid-skipwhite');
            const sparse = sparseFrac();

            if (mode === 'emoji') {
                const dither = isChecked('owotid-dither');
                const { idx, pal } = mapToEmoji(data, w, h, dither, skipWhite, sparse);
                if (w * h <= 6000) {
                    const cellPx = 14;
                    c.width = w * cellPx;
                    c.height = Math.round(h * cellPx * (OWOT_CELL_H / OWOT_CELL_W));
                    c.style.width = displayW + 'px'; c.style.height = displayH + 'px';
                    const ctx = c.getContext('2d');
                    ctx.fillStyle = bgCss; ctx.fillRect(0, 0, c.width, c.height);
                    const cw = c.width / w, ch = c.height / h;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.font = Math.floor(Math.min(cw, ch) * 1.05) + 'px "Segoe UI Emoji","Noto Color Emoji","Apple Color Emoji",sans-serif';
                    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                        const k = idx[y * w + x];
                        if (k < 0) continue;
                        ctx.fillText(pal[k].ch, (x + 0.5) * cw, (y + 0.55) * ch);
                    }
                } else {
                    // For large images, show perceived color blocks as an approximation
                    c.width = w; c.height = h;
                    c.style.width = displayW + 'px'; c.style.height = displayH + 'px';
                    const ctx = c.getContext('2d');
                    const out = ctx.createImageData(w, h);
                    for (let p = 0; p < w * h; p++) {
                        const k = idx[p], o = p * 4;
                        // Use perceived (coverage-blended) color for the preview so it
                        // matches what the eye will actually see on the canvas.
                        const rgb = k < 0 ? bg : pal[k].rgb;
                        out.data[o] = rgb[0]; out.data[o + 1] = rgb[1]; out.data[o + 2] = rgb[2]; out.data[o + 3] = 255;
                    }
                    ctx.putImageData(out, 0, 0);
                }
                return;
            }

            // block mode
            const colorAllowed = canColorText();
            const txt = getDefaultTextColor();
            c.width = w; c.height = h;
            c.style.width = displayW + 'px'; c.style.height = displayH + 'px';
            const ctx = c.getContext('2d');
            const out = ctx.createImageData(w, h);
            for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                const p = y * w + x, i = p * 4, o = p * 4;
                const a = data[i + 3], r = data[i], g = data[i + 1], b = data[i + 2];
                const skip = a < 16 || (skipWhite && r >= 248 && g >= 248 && b >= 248) || (sparse > 0 && sparseSkip(x, y, sparse));
                if (skip) { out.data[o] = bg[0]; out.data[o + 1] = bg[1]; out.data[o + 2] = bg[2]; out.data[o + 3] = 255; continue; }
                if (colorAllowed) { out.data[o] = r; out.data[o + 1] = g; out.data[o + 2] = b; }
                else { out.data[o] = txt[0]; out.data[o + 1] = txt[1]; out.data[o + 2] = txt[2]; }
                out.data[o + 3] = 255;
            }
            ctx.putImageData(out, 0, 0);
        }

        // ---- build cells ----------------------------------------------------------

        function buildCells() {
            if (!g_image) return null;
            const proc = buildProcessedImageData();
            const data = proc.data.data;
            const w = proc.w, h = proc.h;
            const skipWhite = isChecked('owotid-skipwhite');
            const sparse = sparseFrac();
            const mode = effectiveDrawMode();
            const cells = [];

            if (mode === 'emoji') {
                const dither = isChecked('owotid-dither');
                const { idx, pal } = mapToEmoji(data, w, h, dither, skipWhite, sparse);
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                    const k = idx[y * w + x];
                    if (k < 0) continue;
                    cells.push({ dx: x, dy: y, ch: pal[k].ch, fg: 0, sendColor: false });
                }
                return { cells, cellsW: w, cellsH: h, mode };
            }

            const colorAllowed = canColorText();
            const doubleW = isDoubleWidth();
            for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                const i = (y * w + x) * 4;
                if (data[i + 3] < 16) continue;
                if (sparse > 0 && sparseSkip(x, y, sparse)) continue;
                const r = data[i], g = data[i + 1], b = data[i + 2];
                if (skipWhite && r >= 248 && g >= 248 && b >= 248) continue;
                let color = (r << 16) | (g << 8) | b;
                if (color === 0) color = 0x010101;
                const fg = colorAllowed ? color : 0;
                if (doubleW) {
                    cells.push({ dx: x * 2, dy: y, ch: '█', fg, sendColor: colorAllowed });
                    cells.push({ dx: x * 2 + 1, dy: y, ch: '█', fg, sendColor: colorAllowed });
                } else {
                    cells.push({ dx: x, dy: y, ch: '█', fg, sendColor: colorAllowed });
                }
            }
            return { cells, cellsW: doubleW ? w * 2 : w, cellsH: h, mode };
        }

        function diagnose() {
            log('--- Diagnostic ---');
            log('window.w: ' + (typeof W.w));
            if (W.w) {
                log('w.net.write: ' + (W.w.net && typeof W.w.net.write));
                log('w.doGoToCoord: ' + (typeof W.w.doGoToCoord));
                log('w.tile.get: ' + (W.w.tile && typeof W.w.tile.get));
            }
            log('Colored text allowed: ' + canColorText());
            const r = getRateInfo();
            log('Rate: count=' + r.count + ' ms=' + r.ms + ' member=' + r.member + ' -> ' + r.cps + ' cells/s');
            log('Effective draw mode: ' + effectiveDrawMode());
            const pal = getEmojiPalette();
            log('Emoji palette colors: ' + pal.length + ' (coverage-adjusted)');
            // Log a few examples so the user can verify perceived vs raw colors
            const examples = pal.slice(0, 5).map(p =>
                p.ch + ' cov=' + p.coverage.toFixed(2) + ' raw=[' + p.rawRgb + '] perceived=[' + p.rgb + ']'
            ).join(' | ');
            log('Sample palette entries: ' + examples);
            const c = getViewCenterCell();
            if (c) log('View center: tile ' + c.tileX + ',' + c.tileY + ' char ' + c.charX + ',' + c.charY);
        }

        function testWrite() {
            const tileX = readInt('owotid-x'), tileY = readInt('owotid-y');
            const charX = readInt('owotid-cx') || 0, charY = readInt('owotid-cy') || 0;
            if (!Number.isFinite(tileX) || !Number.isFinite(tileY)) { log('Set X and Y first.'); return; }
            const colorAllowed = canColorText();
            const color = 0xFF0000;
            applyLocalWrite(tileX, tileY, charX, charY, '█', colorAllowed ? color : 0, -1);
            const id = nextObjId();
            const edit = [tileY, tileX, charY, charX, Date.now(), '█', id];
            if (colorAllowed) edit.push(color);
            writeWithResponse([edit]).then((resp) => {
                if (resp === false) { log('Test: send FAILED (no write API).'); return; }
                if (!resp) { log('Test: sent (no response info).'); return; }
                const acc = (resp.accepted || []).length;
                const rej = resp.rejected ? Object.keys(resp.rejected).length : 0;
                log('Test result: accepted ' + acc + ', rejected ' + rej + (rej ? ' codes=' + JSON.stringify(resp.rejected) : ''));
            });
        }

        function copyLog() {
            const box = document.getElementById('owotid-log');
            if (!box) return;
            const text = Array.from(box.childNodes).map(n => n.textContent).join('\n');
            navigator.clipboard.writeText(text).then(() => log('Log copied.'), (e) => log('Clipboard failed: ' + (e && e.message ? e.message : e)));
        }

        async function startDrawing() {
            if (g_drawing) { log('Already drawing.'); return; }
            if (!g_image) { log('Load an image first.'); return; }

            if (!g_posSelected) {
                setStatus('⚠ Select a position first: click a cell on the canvas, then "From cursor" (or "From view center").', 'warn');
                log('Select a position first — click a cell on the canvas then press "From cursor", or use "From view center".');
                return;
            }

            const tileX0 = readInt('owotid-x'), tileY0 = readInt('owotid-y');
            const charX0 = readInt('owotid-cx') || 0, charY0 = readInt('owotid-cy') || 0;
            if (!Number.isFinite(tileX0) || !Number.isFinite(tileY0)) { log('Invalid X/Y.'); return; }

            const built = buildCells();
            if (!built || !built.cells.length) { log('No cells to draw (everything skipped?).'); return; }

            const rate = getRateInfo();
            if (built.mode === 'emoji') log('Emoji mode: ' + getEmojiPalette().length + '-color palette (coverage-adjusted perceived colors).');
            else if (!canColorText()) log('NOTE: block mode but colored text is disabled — result is one flat color. Switch to Emoji mode for color.');
            if (rate.cps <= 0 && !rate.member) log('NOTE: this world reports 0 rate for guests. Will keep trying within limits; press Stop to cancel.');

            const startCellX = tileX0 * TILE_C + charX0;
            const startCellY = tileY0 * TILE_R + charY0;

            const autoRate = isChecked('owotid-autorate');
            let chunkSize, sleepMs, targetSleep;
            if (autoRate) {
                const a = computeAutoThroughput();
                chunkSize = Math.max(1, a.chunk); sleepMs = Math.max(0, a.sleep);
            } else {
                chunkSize = Math.max(1, readInt('owotid-chunk') || 100);
                sleepMs = Math.max(0, readInt('owotid-sleep') || 200);
            }
            chunkSize = Math.min(512, chunkSize);
            targetSleep = sleepMs;

            const limWindow = rate.ms;
            const limBudget = rate.member ? Infinity : Math.max(1, rate.count);
            const sendLog = [];
            async function throttle(n) {
                if (!Number.isFinite(limBudget)) return;
                while (!g_abort) {
                    const now = Date.now();
                    while (sendLog.length && now - sendLog[0].t > limWindow) sendLog.shift();
                    let used = 0; for (const e of sendLog) used += e.n;
                    if (used + n <= limBudget * 0.9 || used === 0) break;
                    const waitMs = Math.max(20, limWindow - (now - sendLog[0].t) + 5);
                    setStatus('Waiting for rate window…', 'pause');
                    await bgSleep(Math.min(waitMs, 1000));
                }
            }

            const queue = built.cells.slice();
            const total = queue.length;

            g_drawing = true; g_abort = false; g_paused = false;
            const pauseBtn = document.getElementById('owotid-pause');
            pauseBtn.disabled = false; pauseBtn.textContent = 'Pause';
            document.getElementById('owotid-start').disabled = true;
            setStatus('Drawing 0 / ' + total, null);
            log('Starting: ' + total + ' cells (' + built.cellsW + 'x' + built.cellsH + ', ' + built.mode + ' mode) at tile (' + tileX0 + ',' + tileY0 + ') char (' + charX0 + ',' + charY0 + '). Chunk ' + chunkSize + ', sleep ' + sleepMs + 'ms.');

            let retries = 0, methodReported = false;

            while (queue.length && !g_abort) {
                while (g_paused && !g_abort) { setStatus('Paused (' + (total - queue.length) + ' / ' + total + ')', 'pause'); await bgSleep(150); }
                if (g_abort) break;

                const take = Math.min(chunkSize, queue.length);
                await throttle(take);
                if (g_abort) break;

                const chunk = queue.splice(0, take);
                const ts = Date.now();
                const edits = [];
                const idMap = {};
                for (const cc of chunk) {
                    const gx = startCellX + cc.dx, gy = startCellY + cc.dy;
                    const tileX = Math.floor(gx / TILE_C), tileY = Math.floor(gy / TILE_R);
                    const charX = ((gx % TILE_C) + TILE_C) % TILE_C, charY = ((gy % TILE_R) + TILE_R) % TILE_R;
                    const id = nextObjId();
                    const edit = [tileY, tileX, charY, charX, ts, cc.ch, id];
                    if (cc.sendColor) edit.push(cc.fg);
                    edits.push(edit); idMap[id] = cc;
                    applyLocalWrite(tileX, tileY, charX, charY, cc.ch, cc.fg, -1);
                }
                sendLog.push({ t: Date.now(), n: chunk.length });

                const resp = await writeWithResponse(edits);
                if (resp === false) { log('Send failed (no write API). Stopping.'); break; }
                if (!methodReported) { log('Sending via w.net.write' + (resp ? ' (response tracking on)' : ' (no response info)')); methodReported = true; }

                let rejectedHere = 0;
                if (resp && resp.rejected) {
                    for (const id in resp.rejected) {
                        const cell = idMap[id];
                        if (cell) { queue.push(cell); rejectedHere++; retries++; }
                    }
                }

                const placed = total - queue.length;
                setStatus('Drawing ' + Math.min(placed, total) + ' / ' + total + (retries ? ' (retried ' + retries + ')' : ''), null);

                if (rejectedHere > 0) {
                    sleepMs = Math.min(3000, Math.round(sleepMs * 1.4) + 40);
                    chunkSize = Math.max(8, Math.round(chunkSize * 0.75));
                    log('Throttled by server: ' + rejectedHere + ' requeued. Easing to chunk ' + chunkSize + ', sleep ' + sleepMs + 'ms.');
                } else if (sleepMs > targetSleep) {
                    sleepMs = Math.max(targetSleep, Math.round(sleepMs * 0.92));
                }

                if (queue.length && !g_abort) await bgSleep(sleepMs);
            }

            g_drawing = false; g_paused = false;
            pauseBtn.disabled = true; pauseBtn.textContent = 'Pause';
            document.getElementById('owotid-start').disabled = false;
            const placed = total - queue.length;
            setStatus((g_abort ? 'Stopped ' : 'Done ') + '(' + placed + ' / ' + total + ').', null);
            log((g_abort ? 'Stopped. ' : 'Done. ') + placed + '/' + total + ' placed'
                + (retries ? ', ' + retries + ' retried' : '')
                + '. Off-screen cells appear after the next OWOT fetch (pan there).');
        }

        function ready(fn) {
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
            else fn();
        }

        ready(() => {
            buildUi();
            if (initTimerWorker()) log('Background timer ready — drawing keeps full speed in inactive tabs.');
            else log('Worker timer blocked (CSP?); drawing will slow in background tabs.');
            let tries = 0;
            const tryHook = () => {
                if (hookCursorEvents()) { log('Hooked OWOT cursor events.'); return; }
                if (++tries < 60) setTimeout(tryHook, 250);
            };
            tryHook();
            setTimeout(() => {
                updateWorldInfo();
                const c = getViewCenterCell();
                if (c) {
                    document.getElementById('owotid-x').value = String(c.tileX);
                    document.getElementById('owotid-y').value = String(c.tileY);
                    document.getElementById('owotid-cx').value = String(c.charX);
                    document.getElementById('owotid-cy').value = String(c.charY);
                    document.getElementById('owotid-gox').value = '0';
                    document.getElementById('owotid-goy').value = '0';
                    log('X/Y pre-filled to view center (still confirm a position before drawing).');
                }
                try { getEmojiPalette(); } catch (e) {}
                renderPreview();
            }, 1500);
            setInterval(updateWorldInfo, 5000);
            log('Ready. v3.3: emoji palette now uses coverage-adjusted perceived colors for accurate zoom-out matching.');
        });
    }

    try {
        const s = document.createElement('script');
        s.textContent = '(' + pageScript.toString() + ')();';
        (document.head || document.documentElement || document).appendChild(s);
        s.remove();
    } catch (e) {
        console.error('[owot-id] failed to inject page script:', e);
    }
})();
		</script>
	</body>
